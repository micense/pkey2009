name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml

  # The site build must also succeed on PRs (no deploy).
  web:
    needs: lint
    uses: ./.github/workflows/_build-web.yml

  python:
    needs: lint
    uses: ./.github/workflows/_build-python.yml
