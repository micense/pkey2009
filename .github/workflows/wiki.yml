name: Wiki

# Mirrors docs/ to the GitHub wiki (docs/ is the single source of truth: the
# pages are docs/*.md, the Home/_Sidebar shell is docs/wiki/*.md). This job is
# a plain sync — no page content lives here.
#
# One-time setup: enable the wiki in repo Settings and create its first page
# (GitHub only provisions <repo>.wiki.git once a page exists), and allow
# GITHUB_TOKEN write access (Settings → Actions → Workflow permissions).
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync docs/ to the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git" wiki
          cp docs/*.md wiki/        # content pages (filename = wiki page name)
          cp docs/wiki/*.md wiki/   # Home.md + _Sidebar.md shell
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "docs: sync wiki from docs/ (${SHA})"
          git push
