# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

exclude = '''
(?x)^(
  keygen/web/(node_modules|dist|\.astro|public/res)/.*|
  keygen/python/\.venv/.*|
  res/.*|
  .*\.lock|
  .*pnpm-lock\.yaml
)$
'''

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-merge-conflict" },
  {
    id = "mixed-line-ending",
    args = ["--fix=lf"]
  },
  { id = "check-yaml" },
  {
    id = "check-json",
    exclude = '(^|/)\.vscode/'
  }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.3"
hooks = [
  {
    id = "ruff-check",
    args = ["--fix"],
    files = '^keygen/python/.*\.py$'
  },
  {
    id = "ruff-format",
    files = '^keygen/python/.*\.py$'
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "prettier",
    name = "prettier (keygen/web)",
    language = "system",
    entry = "pnpm --dir keygen/web exec prettier --write .",
    files = "^keygen/web/",
    pass_filenames = false
  }
]
